# Builds the TypeScript and publishes the static site to GitHub Pages.
# One-time setup: repo Settings → Pages → Source → "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # allow manual runs from the Actions tab

# Allow the GITHUB_TOKEN to deploy to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # Assemble the site (index.html + compiled JS). The JS is published under a
      # per-commit path (dist-<sha>/) and index.html is rewritten to point at it,
      # so every deploy loads under a fresh URL and browsers can never serve a
      # stale module graph. A plain dist/ copy is kept too, so any browser still
      # holding an old index.html (which references dist/main.js) doesn't 404.
      - name: Assemble site
        run: |
          mkdir _site
          SHA="${GITHUB_SHA::8}"
          cp -r dist "_site/dist"
          cp -r dist "_site/dist-$SHA"
          sed "s#dist/main.js#dist-$SHA/main.js#" index.html > _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
